[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "balance-tracker"
dynamic = ["version"]
description = "Day-by-day chequing account forecaster for Windows, with an iPhone companion web app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "cryptography>=42"]

[project.gui-scripts]
balance-tracker = "balance_tracker.app:main"

[tool.setuptools.dynamic]
version = { attr = "balance_tracker.__version__" }

[tool.setuptools.packages.find]
include = ["balance_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # bugbear
    "I",    # import order
    "UP",   # modern syntax for the target Python
    "SIM",  # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["balance_tracker"]
