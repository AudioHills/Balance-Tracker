name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build BalanceTracker.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name BalanceTracker --icon assets/icon.ico main.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: BalanceTracker-windows
          path: dist/BalanceTracker.exe

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import balance_tracker; print(balance_tracker.__version__)')" >> "$GITHUB_OUTPUT"

      # Publishes a Release on version tags, and on pushes to the default branch
      # (tagged v<version from balance_tracker/__init__.py>; re-pushing the same
      # version refreshes that release's exe).
      - name: Publish release
        if: >
          github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Balance Tracker ${{ steps.version.outputs.version }}
          files: dist/BalanceTracker.exe
          body: |
            Download **BalanceTracker.exe** below and double-click it. No install needed.

            Windows may show a SmartScreen warning because the app isn't code-signed:
            click **More info → Run anyway**.

            Your data is saved in `%APPDATA%\BalanceTracker`.
